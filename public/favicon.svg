<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff2e63" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#07080b" stop-opacity="0" />
    </radialGradient>

    <!-- Crimson Gradient -->
    <linearGradient id="crimsonBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2e63" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Subtle Bevel Gradient -->
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Dark Ring for Contrast in light/dark browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#07080b" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ambient Glow -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#glowGrad)" />

  <!-- Crimson Badge -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#crimsonBg)" filter="url(#shadow)" />

  <!-- Glossy Highlight Overlay -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#bevelGrad)" />

  <!-- Subtle Diagonal Light Slice -->
  <path d="M5 16C5 9.92487 9.92487 5 16 5H48C54.0751 5 59 9.92487 59 16V22L5 44V16Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Monogram Initials "SR" with precise vector geometry for 100% reliable crisp rendering -->
  <g fill="url(#textGrad)">
    <!-- 'S' Letter -->
    <path d="M26.5 25.5C26.5 21.8 23.8 19 19.2 19C14.5 19 11.5 22.2 11.2 26.5H16.4C16.6 24.4 17.6 23.2 19.2 23.2C20.6 23.2 21.5 24 21.5 25.2C21.5 26.4 20.7 27.1 18.7 27.7C14.6 29 11.5 30.8 11.5 35.5C11.5 40 14.8 43 19.4 43C24.5 43 27 39.8 27.2 35.2H22C21.8 37.6 20.6 38.8 19.3 38.8C17.8 38.8 16.7 37.8 16.7 36.2C16.7 34.6 17.8 33.8 20.2 33C24.4 31.6 26.5 29.5 26.5 25.5Z" />
    
    <!-- 'R' Letter -->
    <path d="M30 19.5H41C46 19.5 49.5 22.5 49.5 27.2C49.5 30.8 47.2 33.4 43.8 34.2L50 42.5H43.8L38.2 34.8H35.2V42.5H30V19.5ZM35.2 30.6H40.6C42.8 30.6 44.2 29.3 44.2 27.2C44.2 25.1 42.8 23.7 40.6 23.7H35.2V30.6Z" />
  </g>

  <!-- Live Status Pulse Dot (Bottom Right) -->
  <circle cx="52" cy="52" r="6" fill="#07080b" />
  <circle cx="52" cy="52" r="4.2" fill="#fb7185" />
  <circle cx="52" cy="52" r="2.2" fill="#ffffff" />
</svg>
